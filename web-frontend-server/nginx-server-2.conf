server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        access_log off;
        return 200 "web-ok\n";
        add_header Content-Type text/plain;
    }

    location = /metrics {
        access_log off;
        default_type text/plain;
        return 200 "minicloud_web_up 1\n";
    }

    add_header X-Backend-Instance "web-frontend-server-2" always;
}
